/* Classic broadcast-style scoreboard */
:root {
  --ink: #172534;
  --muted: #536170;
  --line: #c3cbd2;
  --blue: #163d62;
  --red: #a32129;
  --redwash: #f9eded;
}
body {
  background: repeating-linear-gradient(135deg, #d6dade 0, #d6dade 2px, #d0d5d9 2px, #d0d5d9 4px);
  color: var(--ink);
  font: 14px Arial, Helvetica, sans-serif;
}
.shell {
  max-width: 1240px;
  min-height: 100vh;
  padding: 0 24px 36px;
  border-right: 1px solid #aeb8c1;
  border-left: 1px solid #aeb8c1;
  background: #e8ebee;
  box-shadow: 0 0 18px #17253426;
}
.live {
  gap: 8px;
  color: #33475a;
  font: bold 10px Arial, Helvetica, sans-serif;
  letter-spacing: .04em;
}
.live:before {
  width: 7px;
  height: 7px;
  background: #63c17e;

}

.hero {

}

}

}

  color: #fff;
  font: bold 9px Arial, Helvetica, sans-serif;

}
.game {

.game-team { gap: 6px; }
.team-logo { width: 20px; height: 20px; flex-basis: 20px; }
.game-team b, .game.road .game-team b {

  margin-left: auto;

  font: bold 10px Arial, Helvetica, sans-serif;
}
.game-result.win { border-color: #9ab7a2; background: #e7f2e9; color: #235a34; }
.game-result.loss { border-color: #d3aaaa; background: #f9e9e9; color: #8c252b; }
.game-result.ot-loss { border-color: #cbb79a; background: #f6f0e5; color: #76531e; }
.game-matchup {
  color: #526170;
  font: 10px Arial, Helvetica, sans-serif;
}
button.more {
  padding: 5px 2px;
  color: #214e75;
  font: bold 10px Arial, Helvetica, sans-serif;
}
.empty { color: #536170; }
.empty.error { color: #a32129; }
.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 20px;
  margin-top: 12px;
  color: #536170;
  font: 11px/1.5 Arial, Helvetica, sans-serif;
}
@media(max-width:750px) {
  .shell { padding: 0 12px 24px; }
  .live { line-height: 1.4; }
  .foot .live span { display: inline-block; margin: 0; }
  .hero { padding: 16px 14px; }
  .hero h1 { font-size: clamp(22px, 6vw, 30px); }
  .bar { padding: 9px 12px; }
  .month-controls strong { min-width: 140px; font-size: 14px; }
  .calendar { overflow-x: auto; }
  .day { min-height: 110px; padding: 6px; }
}
</style></head>
<body><main class="shell">
<section class="hero"><div><div class="eyebrow">2026—27 season</div><h1>NHL Back-To-Back Tracker</h1></div></section>
<section class="bar"><div class="month-controls"><button class="iconbtn" id="prev" aria-label="Previous month">‹</button><strong id="month" aria-live="polite"></strong><button class="iconbtn" id="next" aria-label="Next month">›</button></div></section>
<section class="calendar" id="calendar"></section><footer class="foot"><span>Back-to-back = consecutive NHL schedule dates. Red marks away games following an away game.</span><span>Schedule: NHL public API · Updates on load</span><div class="live" id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span> LOADING NHL SCHEDULE</div></footer></main>
<script>
const SCHEDULE_URL = "./data/schedule.json";
const schedule = new Map();
const backToBack = new Map();
const $ = (id) => document.getElementById(id);

let cursor = new Date();
cursor.setDate(1);
let requestId = 0;
let loadState = "loading";
let loadError = "";

function dateKey(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function parseDate(value) {
  return new Date(`${value}T12:00:00`);
}

function addDays(date, amount) {
  const result = new Date(date);
  result.setDate(result.getDate() + amount);
  return result;
}

function nextDate(value) {
  return dateKey(addDays(parseDate(value), 1));
}

function monthDays() {
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const count = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
  return Array.from({ length: count }, (_, index) => addDays(first, index));
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  })[character]);
}

function setStatus(message, state = "ready") {
  const status = $("status");
  status.classList.toggle("error", state === "error");
  status.replaceChildren();

  if (state === "loading") {
    const spinner = document.createElement("span");
    spinner.className = "spinner";
    spinner.setAttribute("aria-hidden", "true");
    status.append(spinner);
  }

  status.append(document.createTextNode(message));
}

function showLoading() {
  $("month").textContent = cursor.toLocaleString(undefined, {
    month: "long",
    year: "numeric",
  });
  const loading = '<div class="empty"><span class="spinner"></span> Loading NHL schedule…</div>';
  $("calendar").innerHTML = loading;
}

async function loadAround() {
  const currentRequest = ++requestId;
  schedule.clear();
  backToBack.clear();
  loadState = "loading";
  setStatus("LOADING NHL SCHEDULE", "loading");
  showLoading();

  try {
    const response = await fetch(SCHEDULE_URL, { cache: "no-store" });
    if (!response.ok) throw new Error(`Published schedule returned ${response.status}.`);
    const data = await response.json();
    if (!Array.isArray(data.gameWeek) || !data.startDate || !data.endDate ||
        !Number.isFinite(Date.parse(data.updatedAt))) {
      throw new Error("The published NHL schedule was incomplete.");
    }

    if (currentRequest !== requestId) return;

    const selectedMonth = dateKey(cursor).slice(0, 7);
    if (selectedMonth < data.startDate.slice(0, 7) ||
        selectedMonth >= data.endDate.slice(0, 7)) {
      throw new Error(`Schedule available from ${data.startDate.slice(0, 7)} through ${dateKey(addDays(parseDate(data.endDate), -1)).slice(0, 7)}.`);
    }

    const seenGames = new Set();
    for (const week of data.gameWeek) {
      for (const game of week.games || []) {
        const date = game.gameDate || week.date;
        if (!date || !game.homeTeam?.abbrev || !game.awayTeam?.abbrev) continue;

        const gameKey = game.id ?? `${date}-${game.awayTeam.abbrev}-${game.homeTeam.abbrev}`;
        if (seenGames.has(gameKey)) continue;
        seenGames.add(gameKey);

        const games = schedule.get(date) || [];
        games.push({ ...game, date });
        schedule.set(date, games);
      }
    }

    buildBackToBack();
    loadState = "ready";
    render();
    const firstOfMonth = dateKey(new Date(cursor.getFullYear(), cursor.getMonth(), 1));
    const nextMonth = dateKey(new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1));
    const gameCount = [...schedule.entries()]
      .filter(([date]) => date >= firstOfMonth && date < nextMonth)
      .reduce((count, [, games]) => count + games.length, 0);
    const updated = new Date(data.updatedAt).toLocaleString();
    const stale = Date.now() - Date.parse(data.updatedAt) > 24 * 60 * 60 * 1000;
    setStatus(`${gameCount} GAMES · ${stale ? "DATA MAY BE OUTDATED · " : ""}UPDATED ${updated}`, stale ? "error" : "ready");
  } catch (error) {
    if (currentRequest !== requestId) return;
    schedule.clear();
    backToBack.clear();
    loadState = "error";
    loadError = error.message;
    render();
    setStatus("SCHEDULE UNAVAILABLE", "error");
    console.error("Unable to load NHL schedule:", error);
  }
}

function buildBackToBack() {
  backToBack.clear();
  const previousByTeam = new Map();

  for (const date of [...schedule.keys()].sort()) {
    const games = schedule.get(date).slice().sort((a, b) =>
      (a.startTimeUTC || "").localeCompare(b.startTimeUTC || ""));

    for (const game of games) {
      if (game.gameState === "PPD" || game.gameState === "CANC") continue;
      const home = game.homeTeam.abbrev;
      const away = game.awayTeam.abbrev;

      for (const [team, venue, opponent] of [
        [home, "HOME", away],
        [away, "AWAY", home],
      ]) {
        const previous = previousByTeam.get(team);
        if (previous && nextDate(previous.date) === date) {
          const rows = backToBack.get(date) || [];
          rows.push({
            date,
            team,
            venue,
            opponent,
            previousVenue: previous.venue,
            game,
          });
          backToBack.set(date, rows);
        }
        previousByTeam.set(team, { date, venue });
      }
    }
  }
}

function isRoadToRoad(row) {
  return row.venue === "AWAY" && row.previousVenue === "AWAY";
}

function logoFor(row) {
  const team = [row.game.homeTeam, row.game.awayTeam]
    .find((candidate) => candidate.abbrev === row.team);
  const logo = team?.logo || team?.darkLogo;
  return typeof logo === "string" && /^https:\/\/assets\.nhle\.com\/logos\/nhl\/svg\/[A-Z]{2,3}_(light|dark)\.svg$/.test(logo)
    ? logo
    : "";
}

function resultFor(row) {
  const game = row.game;
  if (game.gameState !== "FINAL" && game.gameState !== "OFF") return null;

  const isHome = game.homeTeam.abbrev === row.team;
  const isAway = game.awayTeam.abbrev === row.team;
  if (!isHome && !isAway) return null;
  const score = (isHome ? game.homeTeam : game.awayTeam).score;
  const opponentScore = (isHome ? game.awayTeam : game.homeTeam).score;
  if (!Number.isInteger(score) || !Number.isInteger(opponentScore) || score < 0 ||
      opponentScore < 0 || score === opponentScore) return null;
  if (score > opponentScore) return { label: "W", description: "Win", className: "win" };

  const period = game.gameOutcome?.lastPeriodType;
  if (period === "OT" || period === "SO") {
    return { label: "OTL", description: "Overtime or shootout loss", className: "ot-loss" };
  }
  if (period === "REG") return { label: "L", description: "Regulation loss", className: "loss" };
  return null;
}

function rowsFor(date) {
  return (backToBack.get(dateKey(date)) || [])
    .slice()
    .sort((a, b) => a.team.localeCompare(b.team));
}

function renderCalendar(days) {
  const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
    .map((day) => `<div class="weekday">${day}</div>`)
    .join("");
  const today = dateKey(new Date());
  const leading = days[0].getDay();
  const trailing = (7 - (leading + days.length) % 7) % 7;
  const emptyCell = '<div class="day empty-day" aria-hidden="true"></div>';
  const cells = days.map((date) => {
    const key = dateKey(date);
    const rows = rowsFor(date);
    const classes = [
      "day",
      key === today ? "today" : "",
    ].filter(Boolean).join(" ");
    const chips = rows.map((row) => {
      const road = isRoadToRoad(row);
      const logo = logoFor(row);
      const image = logo ? `<img class="team-logo" src="${escapeHtml(logo)}" alt="" loading="lazy">` : "";
      const result = resultFor(row);
      const resultBadge = result
        ? `<span class="game-result ${result.className}" aria-label="${result.description}" title="${result.description}">${result.label}</span>`
        : "";
      const matchup = `${row.previousVenue === "AWAY" ? "Away" : "Home"} → ${row.venue === "AWAY" ? "Away" : "Home"} · ${row.venue === "AWAY" ? "@" : "vs"} ${escapeHtml(row.opponent)}`;
      return `<div class="game${road ? " road" : ""}" title="${escapeHtml(row.team)} is on the second night: ${row.previousVenue} → ${row.venue}"><div class="game-team">${image}<b>${escapeHtml(row.team)}</b>${resultBadge}</div><span class="game-matchup">${matchup}</span></div>`;
    });
    const extraCount = rows.length - 4;
    const extra = extraCount > 0
      ? `<div id="extra-${key}" hidden>${chips.slice(4).join("")}</div><button type="button" class="more" data-count="${extraCount}" aria-expanded="false" aria-controls="extra-${key}" aria-label="View ${extraCount} more teams for ${key}">View ${extraCount} more</button>`
      : "";
    return `<div class="${classes}"><div class="date"><span>${date.getDate()}</span>${key === today ? '<span class="todaytag">TODAY</span>' : ""}</div>${chips.slice(0, 4).join("")}${extra}</div>`;
  }).join("");

  $("calendar").innerHTML = `<div class="weekdays">${weekdays}</div><div class="grid">${emptyCell.repeat(leading)}${cells}${emptyCell.repeat(trailing)}</div>`;
}

function render() {
  if (loadState === "loading") {
    showLoading();
    return;
  }
  if (loadState === "error") {
    showLoading();
    const message = `<div class="empty error">${escapeHtml(loadError)} Try another month or reload.</div>`;
    $("calendar").innerHTML = message;
    return;
  }
  const days = monthDays();
  $("month").textContent = cursor.toLocaleString(undefined, {
    month: "long",
    year: "numeric",
  });
  renderCalendar(days);
}

$("prev").addEventListener("click", () => {
  cursor.setMonth(cursor.getMonth() - 1);
  loadAround();
});
$("next").addEventListener("click", () => {
  cursor.setMonth(cursor.getMonth() + 1);
  loadAround();
});
$("calendar").addEventListener("click", (event) => {
  const button = event.target.closest("button.more");
  if (!button || !$("calendar").contains(button)) return;
  const extra = document.getElementById(button.getAttribute("aria-controls"));
  if (!extra) return;
  extra.hidden = !extra.hidden;
  button.setAttribute("aria-expanded", String(!extra.hidden));
  const date = button.getAttribute("aria-controls").slice("extra-".length);
  const label = extra.hidden ? `View ${button.dataset.count} more` : "Show less";
  button.textContent = label;
  button.setAttribute("aria-label", `${label} teams for ${date}`);
});
loadAround();
</script></body></html>
